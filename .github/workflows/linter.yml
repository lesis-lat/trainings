name: Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflows:
    name: GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.32.0 --offline --format=github .github/workflows

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: List the Markdown files to lint
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          fi

          git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md' > changed-markdown.txt || true

          if [ -s changed-markdown.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          cat changed-markdown.txt

      - name: Set up Node.js
        if: steps.files.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run markdownlint
        if: steps.files.outputs.changed == 'true'
        env:
          npm_config_ignore_scripts: "true"
        run: xargs --delimiter '\n' npx --yes markdownlint-cli2@0.18.1 < changed-markdown.txt
