name: Minify assets

on:
  push:
    branches:
      - main
    paths:
      - "assets/css/**/*.css"
      - "assets/scripts/**/*.js"
      - "!assets/css/**/*.min.css"
      - "!assets/scripts/**/*.min.js"

permissions:
  contents: read

concurrency:
  group: minify-assets
  cancel-in-progress: false

jobs:
  minify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Minify CSS
        run: npx clean-css-cli@5.6.3 -o assets/css/style.min.css assets/css/style.css

      - name: Minify JS
        run: npx terser@5.31.0 assets/scripts/main.js -c -m -o assets/scripts/main.min.js

      - name: Commit and push with a single-use token header
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.min.css assets/scripts/main.min.js
          git commit -m "chore: minify css and js"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push
