name: Security Gate - LESIS

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    env:
      MAX_CRITICAL: 0
      MAX_HIGH: 0
      MAX_MEDIUM: 0
      MAX_LOW: 0
      SECURITY_GATE_IMAGE: ghcr.io/lesis-lat/security-gate/security-gate@sha256:6fb040227eba1d97177aa3f2e7c7a8229df439fd596a13fd9aefdf120286276d
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Pull the security-gate image
        run: docker pull "$SECURITY_GATE_IMAGE"

      - name: Verify security alerts from GHAS
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          docker run --rm \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$SECURITY_GATE_IMAGE" \
            -t "$GITHUB_TOKEN" \
            -r "$REPOSITORY" \
            -c "$MAX_CRITICAL" \
            -h "$MAX_HIGH" \
            -m "$MAX_MEDIUM" \
            -l "$MAX_LOW" \
            --dependency-alerts \
            --secret-alerts \
            --code-alerts
