home:
  title: "Applied security education"
  lead: >-
    Hands-on training for professionals already working in the field, on niche and specialised
    subjects. Short programs held to a high technical bar, delivered by people who work these
    problems day to day.
  next_cohort: "NEXT COHORT"
  catalog: "CATALOG"
  empty: "No trainings scheduled at the moment."
  principles: "HOW WE TEACH"
  principle_1_title: "Practice on real cases"
  principle_1_body: >-
    Concepts come from real problems and cases from industry and are worked through in hands-on
    exercises run in the room, kept close to the situations participants meet at work.
  principle_2_title: "Small cohorts"
  principle_2_body: >-
    Classes are capped at a small number of participants. That is what keeps the quality of the
    delivery, leaves room for real discussion, and lets participants collaborate with each other
    through the exercises.
  principle_3_title: "Who teaches"
  principle_3_body: >-
    Every course is delivered by professionals with authority on the subject — people who
    research, build technology and work in the field, from both industry and academia.
  custom_title: "Training for your team"
  custom_body: >-
    We design tailored programs for engineering, data and security teams, built around the systems
    and threat model of each organization.
  custom_cta: "TALK TO US"


