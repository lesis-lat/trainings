home:
  title: "Formación aplicada en seguridad"
  lead: >-
    Formación práctica para quienes ya trabajan en el área, sobre temas de nicho y especializados.
    Programas cortos, de alto rigor técnico, dictados por profesionales que enfrentan estos
    problemas en su día a día.
  next_cohort: "PRÓXIMA COHORTE"
  catalog: "CATÁLOGO"
  empty: "No hay entrenamientos programados por el momento."
  principles: "CÓMO ENSEÑAMOS"
  principle_1_title: "Práctica sobre casos reales"
  principle_1_body: >-
    Los conceptos parten de problemas y casos reales de la industria y se trabajan en ejercicios
    prácticos guiados en el aula, siempre cerca de las situaciones que los participantes
    encuentran en su trabajo.
  principle_2_title: "Cohortes pequeñas"
  principle_2_body: >-
    Las cohortes se limitan a pocos participantes. Eso es lo que permite sostener la calidad de la
    enseñanza, abrir espacio para una discusión real y lograr que los participantes colaboren
    entre sí a lo largo de los ejercicios.
  principle_3_title: "Quién enseña"
  principle_3_body: >-
    Cada curso está a cargo de profesionales con autoridad en el tema — personas que investigan,
    construyen tecnología y trabajan en el área, tanto desde la industria como desde la academia.
  custom_title: "Formación para tu equipo"
  custom_body: >-
    Diseñamos programas a medida para equipos de ingeniería, datos y seguridad, construidos a
    partir de los sistemas y del modelo de amenazas de cada organización.
  custom_cta: "HABLEMOS"


