  pricing: "INVERSIÓN"
  discount_html: >-
    Podemos ofrecer descuentos de hasta el 50% si formas parte de un grupo minoritario o te
    encuentras en situación de vulnerabilidad social y no puedes pagar el valor completo. Escríbenos
    a <a href="mailto:trainings@lesis.lat">trainings@lesis.lat</a> y evaluaremos cada caso según la
    disponibilidad de cupos.
  refund: "POLÍTICA DE CANCELACIÓN Y REEMBOLSO"
  refund_withdrawal_html: >-
    <b>Derecho de arrepentimiento.</b> Dentro de los 7 días calendario posteriores a la inscripción
    puedes desistir y recibir el 100% del monto pagado, sin necesidad de justificarlo. Esta garantía
    prevalece sobre los plazos que siguen.
  refund_intro: "Pasado ese plazo, el reembolso depende de la anticipación con la que se solicite respecto a la fecha de inicio del entrenamiento."
  refund_transfer: "A menos de 7 días del inicio, aunque no corresponda reembolso, el cupo puede transferirse a otra persona o a la cohorte siguiente."
  refund_note_title: "OBSERVACIÓN IMPORTANTE"
  refund_note: "En todos los casos de cancelación, el monto del reembolso se calcula sobre el valor total pagado por la inscripción, descontando los impuestos, tasas, intereses o recargos cobrados por el procesador de pagos (tarjeta de crédito, banco, etc.), independientemente del medio de pago utilizado."
  location: "LUGAR"
  registration: "CÓMO FUNCIONA LA INSCRIPCIÓN"
  session: "SESIÓN"
  total: "TOTAL"
  language_notice_html: >-
    <b>Este entrenamiento se dicta en portugués (pt-BR).</b> Todas las sesiones, materiales y
    ejercicios son en portugués. Si tienes dudas sobre el idioma, escríbenos a
    <a href="mailto:trainings@lesis.lat">trainings@lesis.lat</a> antes de inscribirte.

# Política de cancelación, compartida por todos los cursos pagos.
