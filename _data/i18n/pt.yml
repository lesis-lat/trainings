home:
  title: "Formação aplicada em segurança"
  lead: >-
    Formações práticas para quem já atua no mercado, sobre temas nichados e especializados.
    Programas curtos, de alto rigor técnico, conduzidos por profissionais que vivem esses
    problemas no dia a dia.
  next_cohort: "PRÓXIMA TURMA"
  catalog: "CATÁLOGO"
  empty: "Nenhum treinamento agendado no momento."
  principles: "COMO ENSINAMOS"
  principle_1_title: "Prática sobre casos reais"
  principle_1_body: >-
    Os conceitos partem de problemas e casos reais da indústria e são trabalhados em exercícios
    práticos conduzidos em sala, mantidos próximos das situações que os participantes encontram
    no trabalho.
  principle_2_title: "Turmas pequenas"
  principle_2_body: >-
    As turmas são limitadas a poucos participantes. É o que permite manter a qualidade da
    condução, abrir espaço para discussão real e fazer com que os participantes colaborem entre
    si ao longo dos exercícios.
  principle_3_title: "Quem ensina"
  principle_3_body: >-
    Cada curso é conduzido por profissionais com autoridade no tema — pessoas que pesquisam,
    constroem tecnologia e atuam na área, vindas tanto da indústria quanto da academia.
  custom_title: "Treinamento para o seu time"
  custom_body: >-
    Desenhamos programas sob medida para times de engenharia, dados e segurança, construídos a
    partir dos sistemas e do modelo de ameaças de cada organização.
  custom_cta: "FALE CONOSCO"


