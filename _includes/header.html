{% include urls.html %}
{% include translations.html %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ home_url | relative_url }}">
      <img class="brand-mark" src="{{ '/assets/images/symbol-black.png' | relative_url }}" alt="" aria-hidden="true" fetchpriority="high">
      <span class="brand-name">{{ t.brand.name }}</span>
      <span class="brand-suffix">{{ t.brand.suffix }}</span>
    </a>

    <nav class="topnav" aria-label="{{ t.a11y.main_nav }}">
      <ul class="nav-links">
        <li><a href="{{ courses_url | relative_url }}"{% if page.url contains 'courses' %} class="active" aria-current="page"{% endif %}>{{ t.nav.courses }}</a></li>
        <li><a href="{{ schedule_url | relative_url }}"{% if page.url contains 'schedule' %} class="active" aria-current="page"{% endif %}>{{ t.nav.schedule }}</a></li>
      </ul>

      {% include language-switch.html %}
    </nav>
  </div>
</header>
